# ApplicationSet do homelab — self-managed.
#
# Este é o ApplicationSet que o ArgoCD reconcilia via GitOps. Sua cópia
# de bootstrap vive em k8s-homelab/ansible/files/applicationset.yaml —
# os dois arquivos devem ser bit-idênticos.
#
# Gera uma Application Kubernetes para cada subdiretório encontrado em
# apps/*/* (qualquer namespace, qualquer aplicação). Adicionar uma nova
# aplicação significa apenas criar apps/<namespace>/<app>/ com manifests
# Kubernetes — sem alterar este arquivo.
#
# Veja ADR-009 no k8s-homelab para o racional dessa duplicação.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/rodrigomsr2/k8s-gitops
        revision: main
        directories:
          - path: apps/*/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rodrigomsr2/k8s-gitops
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
